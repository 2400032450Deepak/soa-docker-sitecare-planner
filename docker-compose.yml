services:
  db:
    image: postgres:16-alpine
    container_name: sitecare-db
    environment:
      POSTGRES_DB: sitecare_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sitecare_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: sitecare-backend
    container_name: sitecare-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/sitecare_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      EUREKA_ENABLED: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8081:8081"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8081
    image: sitecare-frontend
    container_name: sitecare-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
